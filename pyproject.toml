[tool.poetry]
name = "pythonproject"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
requests = "^2.32.5"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.flake8]
max-line-length = 119
exclude = [
    ".git/",
    "__pycache__/",
    ".venv/"
]


[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = [
    "venv/",
    ".venv/",
]
